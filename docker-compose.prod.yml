# TODO: add "core" .yml

services:
  telegram:
    image: majorro/pi-bot:tg-latest
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
  discord:
    image: majorro/pi-bot:dc-latest
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: