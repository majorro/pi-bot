services:
  telegram:
    image: majorro/pi-bot:tg-latest
    build:
      context: src/
      dockerfile: PiBot.Telegram/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
  discord:
    image: majorro/pi-bot:dc-latest
    build:
      context: src/
      dockerfile: PiBot.Discord/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres
  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: