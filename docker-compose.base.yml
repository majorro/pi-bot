services:
  postgres:
    image: postgres:18-alpine
    container_name: pi-bot-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PI_BOT_DB_USER}
      POSTGRES_PASSWORD: ${PI_BOT_DB_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test: ["CMD-SHELL", "pg_isready"]
      timeout: 5s
    volumes:
      - ${PI_BOT_DB_DATA_PATH}:/var/lib/postgresql
  telegram:
    image: ghcr.io/majorro/pi-bot-tg:latest
    container_name: pi-bot-telegram
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
  discord:
    image: ghcr.io/majorro/pi-bot-dc:latest
    container_name: pi-bot-discord
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy